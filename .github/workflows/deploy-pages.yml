name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: edicode-test-system/package-lock.json

      - name: Install dependencies
        working-directory: edicode-test-system
        run: npm install

      - name: Build edicode-test-system
        working-directory: edicode-test-system
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='edicode-test-system' --exclude='_site' ./ _site/
          mkdir -p _site/edicode-test-system
          cp -r edicode-test-system/dist/. _site/edicode-test-system/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
